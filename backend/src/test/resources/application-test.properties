# ==========================================
# PHASE 5 - TEST DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/movie_recommender_test
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Create schema for tests and remove it when the test context closes
spring.jpa.hibernate.ddl-auto=create-drop

# Useful while testing repository behavior
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true